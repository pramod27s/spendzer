# Render Blueprint: API (Docker) + Postgres. New → Blueprint → pick this repo.
databases:
  - name: spendzer-db
    plan: free
    databaseName: spendzer
    user: spendzer

services:
  - type: web
    name: spendzer-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: spendzer-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      # The frontend reaches the API through Vercel's /api rewrite (same origin), so CORS is
      # only a fallback. Set this to your Vercel URL.
      - key: CORS_ORIGINS
        value: '["https://spendzer.vercel.app"]'
      # Re-creates the demo account (demo@spendzer.app) on every deploy.
      - key: SEED_DEMO
        value: "true"
