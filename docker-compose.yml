services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: spendzer
      POSTGRES_PASSWORD: spendzer
      POSTGRES_DB: spendzer
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spendzer -d spendzer"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://spendzer:spendzer@db:5432/spendzer
      COOKIE_SECURE: "false"
      SEED_DEMO: "true"
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic

  frontend:
    image: node:22-alpine
    working_dir: /app
    environment:
      VITE_API_PROXY: http://api:8000
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  pgdata:
